name: Application Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest and lock
        run: composer validate --strict

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: composer analyse

      - name: Run test suite and OpenAPI contract checks
        run: php artisan test

      - name: Audit resolved dependencies
        run: composer audit --no-interaction

  secret-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  infrastructure-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prepare writable ephemeral integration workspace
        run: |
          cp .env.example .env
          mkdir -p vendor storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R a+rwX vendor storage bootstrap/cache
          chmod a+rw .env

      - name: Start real infrastructure and application
        run: docker compose up -d --build postgres redis minio minio-init clamav app

      - name: Apply PostgreSQL migrations
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T app php artisan migrate --force; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color app postgres
          exit 1

      - name: Verify real dependency readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/ready > /tmp/readiness.json; then
              cat /tmp/readiness.json
              grep -q '"status":"ready"' /tmp/readiness.json
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color app postgres redis minio minio-init clamav
          exit 1

      - name: Start real scan worker
        run: docker compose up -d worker

      - name: Exercise real ClamAV file lifecycle
        run: bash scripts/real-clamav-e2e.sh

      - name: Exercise reproducible V1 demo
        run: bash scripts/demo-v1.sh

      - name: Show integration logs on failure
        if: failure()
        run: docker compose logs --no-color app worker postgres redis minio minio-init clamav

      - name: Stop integration environment
        if: always()
        run: docker compose down -v --remove-orphans

  release-audit:
    needs:
      - php-quality
      - secret-hygiene
      - infrastructure-integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify V1 Definition-of-Done release gate
        run: bash scripts/check-v1-release-audit.sh
