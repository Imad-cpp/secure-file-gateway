name: Application Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Diagnose code style
        run: |
          vendor/bin/pint
          git diff -- app/Exceptions/ScannerException.php app/Jobs/ScanStoredFile.php app/Scanning/ClamAvMalwareScanner.php
          exit 1

      - name: Run test suite
        run: php artisan test

      - name: Audit resolved dependencies
        run: composer audit --no-interaction
