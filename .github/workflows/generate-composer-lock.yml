name: Generate Composer Lock

on:
  push:
    branches:
      - chore/v1-contract-evidence
    paths:
      - composer.json
      - .github/workflows/generate-composer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none
          tools: composer:v2

      - name: Resolve dependency lock
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Commit composer.lock through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f composer.lock
          base64 -w 0 composer.lock > /tmp/composer-lock.b64
          jq -n \
            --arg message 'chore: lock PHP dependencies' \
            --arg branch "$GITHUB_REF_NAME" \
            --rawfile content /tmp/composer-lock.b64 \
            '{message: $message, branch: $branch, content: $content}' \
            > /tmp/composer-lock-payload.json
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/composer.lock" \
            --input /tmp/composer-lock-payload.json
