name: Sync Real ClamAV Evidence

on:
  push:
    branches:
      - test/real-clamav-e2e
    paths:
      - .github/workflows/sync-real-clamav-evidence.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: test/real-clamav-e2e

      - name: Apply guarded evidence updates
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'README.md': [
                  (
                      '> **Status:** The V1 contract and core release-evidence gates are now machine checked. In addition to the implemented security lifecycle, the repository has an OpenAPI 3.0.3 contract with route-drift validation, a committed Composer lockfile, Larastan static analysis without a baseline, full-history secret scanning and a real-container readiness gate covering PostgreSQL, Redis, MinIO, ClamAV and Laravel. A full real-engine upload → verdict → delivery scenario, final release notes/license review and the tagged V1 release remain; no production-readiness claim is made.',
                      '> **Status:** The V1 contract and core release-evidence gates are machine checked, including a real ClamAV application-path scenario in CI. A clean upload must pass through the Redis worker and ClamAV, reach `AVAILABLE`, stream byte-identical content through a temporary signed URL and delete successfully; a runtime-generated EICAR antivirus test fixture must reach `REJECTED` and remain non-downloadable. Reproducible demo artifacts, final release notes/license review, the exact-commit Definition-of-Done audit and the tagged V1 release remain; no production-readiness or malware-detection-completeness claim is made.'
                  ),
                  (
                      'The CI suite uses deterministic scanner test doubles for lifecycle tests and a unit-tested ClamAV reply parser. Docker Compose provides the real ClamAV service for local integration; a dedicated real-engine integration test is not yet claimed by CI.',
                      'The ordinary test suite still uses deterministic scanner test doubles for focused lifecycle cases and a unit-tested ClamAV reply parser. In addition, CI now exercises the real application path with the Dockerized Redis worker, MinIO storage and ClamAV `INSTREAM`: a clean text upload must become `AVAILABLE`, stream byte-identical content through a signed capability and delete successfully, while a runtime-generated EICAR antivirus test fixture must become `REJECTED` and fail download-capability issuance. EICAR is test evidence for integration behavior, not proof that ClamAV detects all malicious content.'
                  ),
                  (
                      'GitHub Actions permissions are read-only for the permanent quality workflow, checkout credentials are not persisted, and reusable actions are pinned to full commit SHAs. The real-container readiness job proves dependency wiring and readiness behavior; it does **not** yet claim a complete real-ClamAV upload/verdict/delivery path. See `docs/V1_EVIDENCE.md` for the evidence boundary.',
                      'GitHub Actions permissions are read-only for the permanent quality workflow, checkout credentials are not persisted, and reusable actions are pinned to full commit SHAs. The real-container job now proves both dependency readiness and a real ClamAV application lifecycle for clean and EICAR test content. It does **not** prove detection completeness, arbitrary-file safety or production operational maturity. See `docs/V1_EVIDENCE.md` for the evidence boundary.'
                  ),
                  (
                      '9. **Release-candidate evidence** — real-engine end-to-end check, reproducible demo, release notes/license decision and tagged V1. **← next**',
                      '9. **Release-candidate evidence** — real-engine end-to-end check **✓**; reproducible demo, release notes/license decision, final DoD audit and tagged V1 remain. **← current**'
                  ),
              ],
              'docs/V1_EVIDENCE.md': [
                  (
                      'The job:\n\n1. builds the non-root PHP application image;\n2. starts PostgreSQL, Redis, MinIO, bucket initialization, ClamAV and Laravel;\n3. applies the real PostgreSQL migrations;\n4. calls `/health/ready` until the application verifies PostgreSQL, Redis, both storage zones and ClamAV;\n5. requires the aggregate response to become `{"status":"ready"}`;\n6. tears down the disposable environment.\n\nThis proves that the dependency wiring and readiness probes operate against real local containers in CI rather than only mocks.',
                      'The job:\n\n1. builds the non-root PHP application image;\n2. starts PostgreSQL, Redis, MinIO, bucket initialization, ClamAV and Laravel;\n3. applies the real PostgreSQL migrations;\n4. calls `/health/ready` until the application verifies PostgreSQL, Redis, both storage zones and ClamAV;\n5. requires the aggregate response to become `{"status":"ready"}`;\n6. starts the real Redis-backed `scans` worker;\n7. uploads clean text through the HTTP API, waits for real ClamAV processing, requires `AVAILABLE`, downloads through the issued signed capability, verifies byte equality and deletes the file;\n8. assembles the EICAR antivirus test string at runtime from fragments, uploads it through the same API path, requires real ClamAV to transition it to `REJECTED`, and requires download-capability issuance to return `409 FILE_NOT_AVAILABLE`;\n9. tears down the disposable environment and volumes.\n\nThis proves that dependency wiring, readiness, queue coordination, private storage, the ClamAV `INSTREAM` adapter, lifecycle transitions and controlled delivery operate together against real local containers in CI rather than only mocks.'
                  ),
                  (
                      '## Explicitly not proven yet\n\nThe repository does **not** yet claim all of the following as machine-verified release evidence:\n\n- a complete real-engine upload → ClamAV verdict → lifecycle transition → controlled download scenario;\n- a harmless known-signature rejection scenario against real ClamAV in CI;\n- production deployment maturity, production monitoring or incident-response maturity;\n- a transactional/immutable forensic audit ledger;\n- generic bucket-wide orphan discovery;\n- production-grade availability or performance benchmarks.',
                      '## Real ClamAV application-path evidence\n\n`infrastructure-integration` executes `scripts/real-clamav-e2e.sh` after readiness succeeds. The script uses only synthetic test data and assembles the exact EICAR antivirus test string at runtime rather than storing it contiguously in Git history. The passing gate proves two application paths:\n\n- **clean path:** authenticated HTTP upload → quarantine → Redis worker → real ClamAV `INSTREAM` → private clean promotion → `AVAILABLE` → signed capability → byte-identical private stream → owner deletion;\n- **detected path:** authenticated HTTP upload → quarantine → Redis worker → real ClamAV EICAR detection → `REJECTED` → download capability denied with `409 FILE_NOT_AVAILABLE`.\n\nEICAR is a harmless anti-malware test fixture. A passing EICAR check demonstrates integration with the configured scanning engine; it does not prove detection completeness or that arbitrary files are safe.\n\n## Explicitly not proven yet\n\nThe repository does **not** claim the following as machine-verified release evidence:\n\n- production deployment maturity, production monitoring or incident-response maturity;\n- malware-detection completeness or arbitrary-file safety;\n- a transactional/immutable forensic audit ledger;\n- generic bucket-wide orphan discovery;\n- production-grade availability or performance benchmarks.'
                  ),
                  (
                      'Before tagging public `v1.0.0`, the remaining evidence should include:\n\n1. a deterministic real-ClamAV end-to-end check using a harmless antivirus test signature rather than real malware;\n2. a reproducible documented demo flow from registration through upload/state polling and controlled delivery;\n3. final changelog/release notes and a license decision;\n4. a complete Definition-of-Done review against the exact release commit;\n5. green post-merge CI on the release candidate.',
                      'Before tagging public `v1.0.0`, the remaining evidence should include:\n\n1. a reproducible documented demo flow from registration through upload/state polling and controlled delivery;\n2. final changelog/release notes and a license decision;\n3. a complete Definition-of-Done review against the exact release commit;\n4. green post-merge CI on the release candidate.\n\nThe deterministic real-ClamAV clean + EICAR application-path check is now satisfied by the permanent `Application Quality` workflow.'
                  ),
              ],
              'docs/DEFINITION_OF_DONE.md': [
                  (
                      '**Current integration status:** CI boots PostgreSQL, Redis, MinIO, ClamAV and the non-root Laravel application, applies the real PostgreSQL migrations and requires `/health/ready` to verify every dependency. This satisfies the real dependency/readiness boundary.\n\nThe malware lifecycle suite may use deterministic test adapters in ordinary tests, but a full real-engine file-processing check is still required before the project claims end-to-end operational malware-scanning evidence.',
                      '**Current integration status:** CI boots PostgreSQL, Redis, MinIO, ClamAV and the non-root Laravel application, applies the real PostgreSQL migrations, requires `/health/ready` to verify every dependency, starts the Redis-backed scan worker, and executes the real application lifecycle for both clean content and a runtime-generated EICAR antivirus test fixture. The clean path must reach `AVAILABLE`, stream byte-identical signed content and delete successfully; the EICAR path must reach `REJECTED` and remain non-downloadable. This satisfies the V1 real-engine integration evidence requirement without claiming production operations or detection completeness.'
                  ),
                  (
                      'The current `Application Quality` gate strictly validates and installs the committed Composer lock, runs Pint, Larastan/PHPStan level 5 without a baseline, the complete PHPUnit suite including OpenAPI route-drift checks, Composer audit, a separate full-history Gitleaks scan, and a real-container infrastructure/readiness job. The remaining release evidence is the full real-engine file-processing scenario plus final demo/release artifacts—not the core quality gates listed above.',
                      'The current `Application Quality` gate strictly validates and installs the committed Composer lock, runs Pint, Larastan/PHPStan level 5 without a baseline, the complete PHPUnit suite including OpenAPI route-drift checks, Composer audit, a separate full-history Gitleaks scan, and a real-container infrastructure job that includes the clean + EICAR ClamAV application-path scenario. The remaining release work is the reproducible demo/release artifacts, final license/release-note decisions, exact-commit DoD review and tagged release—not the core quality or real-engine gates listed above.'
                  ),
              ],
              'docs/SECURITY_MODEL.md': [
                  (
                      'Current CI covers the implemented identity, ingestion, scanning, controlled-delivery, deletion, request-correlation, audit-sanitization, readiness-response and targeted-reconciliation layers. The permanent gate also enforces a committed dependency lock, Larastan/PHPStan level 5 without a baseline, OpenAPI route-drift validation, Composer dependency audit and full-history Gitleaks scanning. A real-container integration job boots PostgreSQL, Redis, both MinIO storage zones, ClamAV and Laravel and requires aggregate readiness to succeed. Scanner lifecycle tests still use deterministic adapters, so CI does **not** yet claim a complete real-engine upload → malware verdict → delivery scenario.',
                      'Current CI covers the implemented identity, ingestion, scanning, controlled-delivery, deletion, request-correlation, audit-sanitization, readiness-response and targeted-reconciliation layers. The permanent gate also enforces a committed dependency lock, Larastan/PHPStan level 5 without a baseline, OpenAPI route-drift validation, Composer dependency audit and full-history Gitleaks scanning. Its real-container job boots PostgreSQL, Redis, both MinIO storage zones, ClamAV and Laravel, requires aggregate readiness, starts the Redis-backed scan worker, then exercises clean and runtime-generated EICAR uploads through the real HTTP/application path. The clean fixture must become `AVAILABLE` and stream byte-identical signed content before deletion; the EICAR fixture must become `REJECTED` and remain non-downloadable. This is real-engine integration evidence, not a claim of malware-detection completeness, arbitrary-file safety or production operational maturity.'
                  ),
              ],
              'docs/ARCHITECTURE.md': [
                  (
                      'The application contract remains replaceable; the domain does not depend directly on ClamAV protocol types.\n\n## Delivery flow',
                      'The application contract remains replaceable; the domain does not depend directly on ClamAV protocol types.\n\nThe permanent integration gate now exercises this boundary through the application rather than calling a scanner CLI directly: a clean upload must traverse quarantine → Redis worker → ClamAV `INSTREAM` → clean storage → `AVAILABLE` → signed byte-identical delivery → deletion, while a runtime-generated EICAR antivirus test fixture must traverse the same ingestion/worker path to `REJECTED` and remain non-downloadable. This validates integration behavior without asserting detection completeness.\n\n## Delivery flow'
                  ),
              ],
              'docs/DECISIONS.md': [
                  (
                      '## Deferred decisions\n',
                      '## D-042 — Real scanner release evidence uses the application path and runtime EICAR\n\n**Status:** Accepted for V1\n\n**Decision:** the permanent integration gate proves ClamAV participation by sending both clean synthetic content and the harmless EICAR antivirus test fixture through the normal authenticated HTTP upload, quarantine, Redis worker and `INSTREAM` adapter path. The exact EICAR test string is assembled at runtime from fragments instead of being stored contiguously in Git history.\n\nThe clean fixture must reach `AVAILABLE`, stream byte-identical content through a temporary signed capability and delete successfully. The EICAR fixture must reach `REJECTED`, and download-capability issuance must fail with `FILE_NOT_AVAILABLE`.\n\n**Why:** invoking `clamscan` directly would prove the scanner image can detect a fixture but would bypass the application security boundary this repository is intended to demonstrate. Runtime construction keeps the repository source focused on the test logic rather than storing the complete detection signature.\n\n**Evidence boundary:** EICAR demonstrates configured-engine integration and fail-closed lifecycle behavior. It does not prove malware-detection completeness, arbitrary-file safety, production operations or incident-response maturity.\n\n## Deferred decisions\n'
                  ),
              ],
          }

          for path, pairs in replacements.items():
              file_path = Path(path)
              text = file_path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one guarded target, found {count}')
                  text = text.replace(old, new, 1)
              file_path.write_text(text)
          PY

      - name: Commit synchronized evidence docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/V1_EVIDENCE.md docs/DEFINITION_OF_DONE.md docs/SECURITY_MODEL.md docs/ARCHITECTURE.md docs/DECISIONS.md
          git diff --cached --check
          git commit -m 'docs: record real ClamAV release evidence'
          git push origin HEAD:test/real-clamav-e2e
