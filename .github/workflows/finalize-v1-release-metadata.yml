name: Finalize V1 Release Metadata

on:
  push:
    branches:
      - release/v1.0.0
    paths:
      - .github/workflows/finalize-v1-release-metadata.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: release/v1.0.0

      - name: Apply guarded release metadata finalization
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected replacement target exactly once, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'README.md',
              '> **Status:** The V1 contract, security evidence, release artifacts and Definition-of-Done are now encoded in permanent machine-checked gates, including a dependent `release-audit` job that runs only after PHP quality, secret hygiene and real infrastructure integration succeed on the same commit. The `v1.0.0` tag/release remains unpublished until that gate is green on the exact `main` commit selected for release; no production-readiness, availability-guarantee or malware-detection-completeness claim is made.',
              '> **Status:** `v1.0.0` is the first public portfolio release boundary for Secure File Gateway. Its contract, security evidence, release artifacts and Definition of Done are enforced by permanent machine-checked gates. Release publication is allowed only from an exact `main` commit whose `Application Quality` workflow, including the dependent `release-audit` job, succeeds; no production-readiness, availability-guarantee or malware-detection-completeness claim is made.',
          )

          replace_once(
              'README.md',
              '- [Changelog](CHANGELOG.md) — release-candidate change record; `v1.0.0` remains unreleased until the final gate passes.\n- [Prepared V1 Release Notes](docs/releases/v1.0.0.md) — source material for the future GitHub `v1.0.0` release.',
              '- [Changelog](CHANGELOG.md) — versioned release history and current unreleased changes.\n- [V1 Release Notes](docs/releases/v1.0.0.md) — canonical in-repository notes for `v1.0.0`.',
          )

          replace_once(
              'README.md',
              '## What V1 will prove\n\nWhen complete, this repository should provide public evidence of:',
              '## What V1 proves\n\nThis repository provides public evidence of:',
          )

          replace_once(
              'README.md',
              '9. **Release-candidate evidence** — real-engine end-to-end check **✓**; reproducible public demo **✓**; MIT license + changelog + prepared release notes **✓**; exact-commit DoD release gate **✓ automated**; tagged V1 remains. **← current**',
              '9. **V1 release evidence** — real-engine end-to-end check **✓**; reproducible public demo **✓**; MIT license + changelog + V1 release notes **✓**; exact-commit DoD release gate **✓**.\n\nRelease publication follows D-045: the immutable tag and GitHub release must target an exact verified `main` commit.',
          )

          replace_once(
              'CHANGELOG.md',
              'The project follows semantic versioning once tagged releases begin. Until `v1.0.0` is created, the release-candidate work remains under **Unreleased**.\n\n## [Unreleased]\n\n### V1 release candidate\n\nThe current release candidate establishes the first complete public portfolio boundary for the gateway. The tag is intentionally not created until the exact release commit passes the final Definition-of-Done audit and post-merge quality gate.\n\n### Added',
              'The project follows Semantic Versioning beginning with `v1.0.0`.\n\n## [Unreleased]\n\nNo changes yet.\n\n## [1.0.0] - 2026-08-13\n\n### Added',
          )

          replace_once(
              'docs/releases/v1.0.0.md',
              '> **Release status:** prepared release notes. The `v1.0.0` tag and GitHub release do not exist yet. They must only be created after the exact release commit passes the final Definition-of-Done audit and post-merge `Application Quality` gate.',
              '> **Release:** `v1.0.0` is the first public portfolio release of Secure File Gateway. This file is the canonical in-repository release-note source. Publication is permitted only from an exact `main` commit whose permanent `Application Quality` workflow, including the dependent `release-audit` job, succeeds.',
          )

          replace_once(
              'docs/releases/v1.0.0.md',
              'The permanent `Application Quality` workflow checks three independent boundaries:\n\n1. **`php-quality`** — strict Composer lock validation/install, Pint, Larastan/PHPStan level 5 without a baseline, automated tests including OpenAPI route-drift checks, and Composer audit.\n2. **`secret-hygiene`** — full-history Gitleaks scanning with read-only workflow permissions.\n3. **`infrastructure-integration`** — real Dockerized Laravel/PostgreSQL/Redis/MinIO/ClamAV topology, migrations, aggregate readiness, Redis scan worker, real clean + runtime-generated EICAR application paths, and the same reproducible public demo documented for contributors.',
              'The permanent `Application Quality` workflow checks three substantive boundaries plus a dependent release gate:\n\n1. **`php-quality`** — strict Composer lock validation/install, Pint, Larastan/PHPStan level 5 without a baseline, automated tests including OpenAPI route-drift checks, and Composer audit.\n2. **`secret-hygiene`** — full-history Gitleaks scanning with read-only workflow permissions.\n3. **`infrastructure-integration`** — real Dockerized Laravel/PostgreSQL/Redis/MinIO/ClamAV topology, migrations, aggregate readiness, Redis scan worker, real clean + runtime-generated EICAR application paths, and the same reproducible public demo documented for contributors.\n4. **`release-audit`** — runs only after the three substantive jobs succeed and emits `V1_RELEASE_AUDIT=PASS` after checking the V1 release artifacts and bounded Definition-of-Done claims on the same repository snapshot.',
          )

          replace_once(
              'docs/releases/v1.0.0.md',
              '## Before creating the tag\n\nThe release operator must still:\n\n1. confirm the exact `main` release commit has green post-merge `Application Quality` CI, including the dependent `release-audit` job and its `V1_RELEASE_AUDIT=PASS` marker;\n2. create the immutable `v1.0.0` tag and GitHub release from that exact verified commit.\n\nUntil those steps are complete, this document is release-note source material rather than evidence that `v1.0.0` has shipped.',
              '## Release integrity\n\nThe immutable `v1.0.0` tag and GitHub release must target the exact `main` commit whose post-merge `Application Quality` workflow succeeds for `php-quality`, `secret-hygiene`, `infrastructure-integration` and dependent `release-audit`, with the audit emitting `V1_RELEASE_AUDIT=PASS`.\n\nOnce created, the tag must never be moved or recreated against a different commit. This document remains the canonical in-repository source for the GitHub release body.',
          )

          replace_once(
              'docs/V1_EVIDENCE.md',
              '## Release-candidate gate\n\nThe release-artifact gate is now prepared in-repository: `LICENSE` contains the MIT License, `CHANGELOG.md` records the V1 release-candidate scope, and `docs/releases/v1.0.0.md` is the source for the future GitHub release notes. None of those files implies that the tag already exists.\n\nThe final Definition-of-Done review is recorded in `docs/V1_RELEASE_AUDIT.md` and enforced by the permanent dependent `release-audit` job. That job can run only after `php-quality`, `secret-hygiene` and `infrastructure-integration` succeed on the same commit, then verifies the required V1 artifacts and evidence boundaries and emits `V1_RELEASE_AUDIT=PASS`.\n\nBefore tagging public `v1.0.0`, the remaining release evidence is one green post-merge `Application Quality` run on the exact `main` commit selected for the tag, including successful `release-audit`. The deterministic real-ClamAV clean + EICAR application-path check, reproducible synthetic public demo, release-artifact preparation and machine-checked DoD gate are now implemented.',
              '## V1 release integrity\n\nThe release artifacts are versioned in-repository: `LICENSE` contains the MIT License, `CHANGELOG.md` contains the dated `1.0.0` entry, and `docs/releases/v1.0.0.md` is the canonical source for the GitHub release notes.\n\nThe final Definition-of-Done review is recorded in `docs/V1_RELEASE_AUDIT.md` and enforced by the permanent dependent `release-audit` job. That job can run only after `php-quality`, `secret-hygiene` and `infrastructure-integration` succeed on the same commit, then verifies the required V1 artifacts and evidence boundaries and emits `V1_RELEASE_AUDIT=PASS`.\n\nThe `v1.0.0` tag and GitHub release may target only the exact `main` commit whose post-merge `Application Quality` workflow, including `release-audit`, succeeds. Once published, the tag is immutable and must not be moved to a different commit. The deterministic real-ClamAV clean + EICAR application-path check, reproducible synthetic public demo, release artifacts and machine-checked DoD gate remain the bounded V1 evidence.',
          )

          replace_once(
              'docs/V1_RELEASE_AUDIT.md',
              'This document records the Definition-of-Done review for the first public portfolio release candidate of Secure File Gateway.',
              'This document records the Definition-of-Done review for the first public portfolio release of Secure File Gateway.',
          )

          replace_once(
              'docs/V1_RELEASE_AUDIT.md',
              '| Release artifacts | PASS | MIT `LICENSE`, `CHANGELOG.md`, prepared `docs/releases/v1.0.0.md`, security policy, evidence ledger and project documentation are present. |',
              '| Release artifacts | PASS | MIT `LICENSE`, dated `CHANGELOG.md` entry, canonical `docs/releases/v1.0.0.md`, security policy, evidence ledger and project documentation are present. |',
          )

          replace_once(
              'docs/V1_RELEASE_AUDIT.md',
              'Until that post-merge result exists, `CHANGELOG.md` remains under `Unreleased` and `docs/releases/v1.0.0.md` remains prepared release-note source material.',
              'The tagged commit must contain the dated `1.0.0` changelog entry and canonical V1 release notes. Once created, the `v1.0.0` tag is immutable and must not be moved or recreated against another commit.',
          )

          replace_once(
              'docs/DECISIONS.md',
              '**Decision:** the permanent `Application Quality` workflow includes a `release-audit` job that depends on successful `php-quality`, `secret-hygiene` and `infrastructure-integration` jobs. It then runs `scripts/check-v1-release-audit.sh` against the same repository snapshot. The `v1.0.0` tag may target only a `main` commit whose complete workflow, including `release-audit`, succeeds.',
              '**Decision:** the permanent `Application Quality` workflow includes a `release-audit` job that depends on successful `php-quality`, `secret-hygiene` and `infrastructure-integration` jobs. It then runs `scripts/check-v1-release-audit.sh` against the same repository snapshot. The `v1.0.0` tag may target only a `main` commit whose complete workflow, including `release-audit`, succeeds. Once created, the `v1.0.0` tag is immutable and must not be moved or recreated against another commit.',
          )

          replace_once(
              'scripts/check-v1-release-audit.sh',
              "grep -Fq '## [Unreleased]' CHANGELOG.md || fail 'changelog-not-unreleased'\ngrep -Fq 'The `v1.0.0` tag and GitHub release do not exist yet.' docs/releases/v1.0.0.md || fail 'release-notes-tag-boundary-missing'",
              "grep -Fq '## [Unreleased]' CHANGELOG.md || fail 'changelog-unreleased-section-missing'\ngrep -Fq '## [1.0.0] - 2026-08-13' CHANGELOG.md || fail 'v1-changelog-entry-missing'\ngrep -Fq '# Secure File Gateway v1.0.0 — Release Notes' docs/releases/v1.0.0.md || fail 'v1-release-notes-missing'\ngrep -Fq 'Once created, the tag must never be moved' docs/releases/v1.0.0.md || fail 'tag-immutability-boundary-missing'",
          )

          replace_once(
              'scripts/check-v1-release-audit.sh',
              '  .github/workflows/sync-v1-final-audit.yml; do',
              '  .github/workflows/sync-v1-final-audit.yml \\\n  .github/workflows/finalize-v1-release-metadata.yml; do',
          )
          PY

      - name: Commit finalized release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/DECISIONS.md docs/V1_EVIDENCE.md docs/V1_RELEASE_AUDIT.md docs/releases/v1.0.0.md scripts/check-v1-release-audit.sh
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'release: finalize v1.0.0 metadata'
          git push origin HEAD:release/v1.0.0
